<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workout Timer</title>

<!-- Google Font for Futuristic Header -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&display=swap" rel="stylesheet">

<!-- Home Screen App & Icon Meta Tags -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#081b26">

<!-- Fixed Raw Image URLs for Home Screen Icons -->
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/xStix99x/workout-timer/refs/heads/main/Timer%20icon%202.jpeg">
<link rel="icon" type="image/jpeg" href="https://raw.githubusercontent.com/xStix99x/workout-timer/refs/heads/main/Timer%20icon%202.jpeg">

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: radial-gradient(circle at 80% 20%, #103347 0%, #081b26 50%, #030b10 100%);
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .title-header {
    font-family: 'Orbitron', 'Arial Narrow', sans-serif;
    color: #38bdf8;
    font-size: 2.5rem;
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 25px;
    text-align: center;
  }

  .timer-display {
    font-size: 5.5rem;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: -2px;
    margin-bottom: 35px;
    color: #ffffff;
    text-align: center;
  }

  .button-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    width: 100%;
    max-width: 360px;
  }

  .timer-btn {
    background-color: transparent;
    color: #38bdf8;
    border: 2px solid #38bdf8;
    padding: 22px 10px;
    font-size: 1.5rem;
    font-weight: 800;
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1.15;
  }

  .timer-btn span {
    font-size: 1.1rem;
    font-weight: 700;
    margin-top: 4px;
  }

  .timer-btn:active {
    transform: scale(0.96);
    background-color: rgba(56, 189, 248, 0.15);
  }
</style>
</head>
<body>

  <div class="title-header">WORKOUT TIMER</div>

  <div class="timer-display" id="display">00:00</div>

  <div class="button-grid">
    <button class="timer-btn" onclick="startTimer(30)">30 <span>seconds</span></button>
    <button class="timer-btn" onclick="startTimer(45)">45 <span>seconds</span></button>
    <button class="timer-btn" onclick="startTimer(60)">60 <span>seconds</span></button>
    <button class="timer-btn" onclick="startTimer(90)">90 <span>seconds</span></button>
  </div>

<script>
  let timerInterval = null;
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function startTimer(seconds) {
    initAudio();
    clearInterval(timerInterval);

    let remainingSeconds = seconds;
    updateDisplay(remainingSeconds);

    timerInterval = setInterval(() => {
      remainingSeconds--;
      updateDisplay(remainingSeconds);

      if (remainingSeconds <= 0) {
        clearInterval(timerInterval);
        playLoudDoubleBeep();
      }
    }, 1000);
  }

  function updateDisplay(totalSeconds) {
    const mins = Math.floor(totalSeconds / 60);
    const secs = totalSeconds % 60;
    const formattedMins = String(mins).padStart(2, '0');
    const formattedSecs = String(secs).padStart(2, '0');
    document.getElementById('display').textContent = `${formattedMins}:${formattedSecs}`;
  }

  function playLoudDoubleBeep() {
    if (!audioCtx) return;

    const playBeep = (time) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'square';
      osc.frequency.setValueAtTime(1000, time);

      gain.gain.setValueAtTime(1.0, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + 0.15);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(time);
      osc.stop(time + 0.15);
    };

    const now = audioCtx.currentTime;
    playBeep(now);
    playBeep(now + 0.25);
  }
</script>

</body>
</html>
